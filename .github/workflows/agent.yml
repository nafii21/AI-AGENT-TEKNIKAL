name: XAU-NAS Agent Runner

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Simbol (XAUUSD / NASDAQ)'
        required: true
      tf:
        description: 'Timeframe (M15 / H1 / H4 / D1)'
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # --- TAMBAHAN BARU: Clone Kronos Resmi ---
      - name: Clone Kronos Official Repo
        run: |
          git clone https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          cd /tmp/Kronos
          pip install -r requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Agent Handler
        env:
          PYTHONPATH: /tmp/Kronos:$PYTHONPATH
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python handler.py --symbol ${{ github.event.inputs.symbol }} --tf ${{ github.event.inputs.tf }}
