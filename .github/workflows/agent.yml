name: Hermes PA Sniper

on:
  workflow_dispatch:
    inputs:
      bias_tf: { description: 'Bias Timeframe', required: false }
      setup_tf: { description: 'Setup Timeframe', required: false }
      cmd: { description: 'Command', required: false }

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Deps
        run: pip install -r requirements.txt

      - name: Run Agent
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python handler.py --bias_tf "${{ github.event.inputs.bias_tf }}" --setup_tf "${{ github.event.inputs.setup_tf }}" --cmd "${{ github.event.inputs.cmd }}"

      - name: Commit Journal & Setup Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add active_setups.json journal.db || true
          git commit -m "Update auto-journal & setup tracker [skip ci]" || echo "Tidak ada perubahan"
          git push || true
